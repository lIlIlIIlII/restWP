<!DOCTYPE html>
<html>
<head>
    <title>Post da WordPress</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Elenco dei post</h1>
    <ul id="lista-post"></ul>

    <script>
        // URL del sito WordPress (puoi cambiarlo con un altro)
        const url = "https://demo.wp-api.org/wp-json/wp/v2/posts";

        fetch(url)
            .then(risposta => risposta.json())
            .then(dati => {
                const lista = document.getElementById("lista-post");

                for (let i = 0; i < dati.length; i++) {
                    let elemento = document.createElement("li");
                    elemento.innerHTML = dati[i].title.rendered;
                    lista.appendChild(elemento);
                }
            });
    </script>
</body>
</html>
