<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Notizie TechCrunch</title>
</head>
<body>

    <h1>Ultimi Articoli</h1>

    <div id="post-container"></div>

    <script>
        const apiUrl = "https://techcrunch.com/wp-json/wp/v2/posts";

        async function caricaArticoli() {
            try {
                const risposta = await fetch(apiUrl);
                const dati = await risposta.json();

                const contenitore = document.getElementById("post-container");

                for (let articolo of dati) {
                    const titolo = document.createElement("h2");
                    titolo.innerHTML = articolo.title.rendered;
                    contenitore.appendChild(titolo);
                }
            } catch (errore) {
                console.error("Errore nel caricamento:", errore);
            }
        }

        window.addEventListener("DOMContentLoaded", caricaArticoli);
    </script>

</body>
</html>
