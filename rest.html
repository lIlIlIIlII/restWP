<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Post da WordPress</title>
</head>
<body>
    <h1>Ultimi Post</h1>
    <ul id="post"></ul>

    <script>
        let url = "https://demo.wp-api.org/wp-json/wp/v2/posts";

        fetch(url)
            .then(risposta => risposta.json()) 
            .then(dati => {
                let elenco = document.getElementById("post");
               
                for (let i = 0; i < dati.length; i++) {
                    let item = document.createElement("li");
                    item.innerHTML = dati[i].title.rendered;
                    elenco.appendChild(item);
                }
            });
    </script>
</body>
</html>
